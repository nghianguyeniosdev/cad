name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="acd-${version}-aarch64-apple-darwin.tar.gz"
          tar -C "target/aarch64-apple-darwin/release" -czf "$tarball" acd
          shasum -a 256 "$tarball" | awk '{print $1}' > "$tarball.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: |
            acd-*.tar.gz
            acd-*.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm_sha="$(cat "dist/acd-${version}-aarch64-apple-darwin.tar.gz.sha256")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > acd.rb <<RUBY
          class Acd < Formula
            desc "Download and verify AWS CodeArtifact generic-package assets"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            depends_on arch: :arm64
            depends_on :macos

            url "${base}/acd-${version}-aarch64-apple-darwin.tar.gz"
            sha256 "${arm_sha}"

            def install
              bin.install "acd"
            end

            test do
              assert_match "acd", shell_output("#{bin}/acd version")
            end
          end
          RUBY

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/acd-*.tar.gz
            acd.rb
