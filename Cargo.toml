[package]
name = "acd"
version = "0.1.0"
edition = "2021"
description = "Download and verify AWS CodeArtifact generic-package assets"
license = "MIT"

[lib]
name = "acd"
path = "src/lib.rs"

[[bin]]
name = "acd"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures = "0.3"
indicatif = "0.17"
md-5 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-codeartifact = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tempfile = "3"
